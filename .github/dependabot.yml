# Dependabot version updates for the pnpm workspace + GitHub Actions.
# Security updates are a repo setting (Code security → Dependabot).
# Do not use this file to land majors in bulk — majors stay ungrouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 8
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 4
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
