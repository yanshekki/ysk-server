# YSK Server CI — gates, typecheck, build, unit tests, degraded e2e
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # version comes from package.json "packageManager" — do not set version here
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: install.sh syntax
        run: bash -n install.sh && bash install.sh --help >/dev/null

      - name: Honesty + UI + i18n gates
        run: pnpm gates

      - name: Docs bilingual parity
        run: pnpm docs:bilingual

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Real-ops e2e (degraded, non-root)
        run: pnpm e2e:real-ops

      - name: Core coverage summary
        run: pnpm --filter @ysk/core test:coverage
        continue-on-error: true
