name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fast static gates (no compile) — fail closed on honesty + UI primitives
      - name: Honesty + UI gates
        run: pnpm gates

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Real-ops e2e (degraded, non-root)
        run: pnpm e2e:real-ops

      - name: Core coverage summary
        run: pnpm --filter @ysk/core test:coverage
        continue-on-error: true
