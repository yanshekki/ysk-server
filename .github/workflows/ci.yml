# YSK Server CI — gates, typecheck, build, unit tests, degraded e2e
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: install.sh syntax
        run: bash -n install.sh && bash install.sh --help >/dev/null

      - name: Honesty + UI + i18n gates
        run: pnpm gates

      - name: Docs bilingual parity
        run: pnpm docs:bilingual

  build-test:
    name: Build & test
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages export types from dist/ — build before typecheck
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Coverage floors drift with feature growth; report but do not block release CI.
      # Unit tests above are the hard gate. Re-lock floors in a dedicated coverage PR.
      - name: Shared coverage (report)
        run: pnpm --filter @ysk/shared test:coverage
        continue-on-error: true

      - name: Core coverage (report)
        run: pnpm --filter @ysk/core test:coverage
        continue-on-error: true

      - name: Server coverage (report)
        run: pnpm --filter @ysk/server test:coverage
        continue-on-error: true

      - name: Web coverage (report)
        run: pnpm --filter @ysk/web test:coverage
        continue-on-error: true

      - name: Coverage aggregate + export report
        run: |
          node ./scripts/coverage-aggregate.mjs
          node ./scripts/test-export-coverage.mjs
        continue-on-error: true

      - name: Real-ops e2e (degraded, non-root)
        run: pnpm e2e:real-ops
        continue-on-error: true

  # Known debt: many host scripts still embed raw `command -v`.
  # Report-only job always green so branch protection is not blocked.
  probe-ssot:
    name: Probe SSOT (report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: software-probe SSOT (non-blocking)
        run: |
          if pnpm probe:ssot; then
            echo "probe:ssot clean"
          else
            echo "::warning::probe:ssot has known debt (raw command -v outside software-probe/). Not blocking CI."
            exit 0
          fi
