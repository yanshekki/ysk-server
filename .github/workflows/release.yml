# npm Trusted Publishing (OIDC). No NPM_TOKEN and no NODE_AUTH_TOKEN.
# Before the first tag, configure a Trusted Publisher on npmjs.com for each of
# ysk-server-shared, ysk-server-core, and ysk-server:
#   GitHub Actions, owner yanshekki, repo ysk-server, workflow release.yml.
# Manual publish (scripts/publish-ysk-server-npm.sh) is unchanged.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm trusted publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          # No registry-url. That input makes setup-node export NODE_AUTH_TOKEN
          # and write an _authToken line, which publishes with a token instead of OIDC.

      # Trusted publishing needs npm >= 11.5.1. Pin a current 11.x (not npm 12).
      - name: Install npm CLI for trusted publishing
        run: npm install -g npm@11.21.1 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify tag matches all three package versions
        run: |
          set -euo pipefail
          SERVER="$(node -p "require('./apps/server/package.json').version")"
          SHARED="$(node -p "require('./packages/shared/package.json').version")"
          CORE="$(node -p "require('./packages/core/package.json').version")"
          test "$SHARED" = "$SERVER"
          test "$CORE" = "$SERVER"
          test "${GITHUB_REF_NAME}" = "v${SERVER}"
          echo "tag v${SERVER} matches shared, core, and ysk-server"

      - name: Publish shared, core, then server
        env:
          # Drop a repo secret if the runner injected one. Provenance uses OIDC.
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: bash scripts/ci-trusted-publish.sh
